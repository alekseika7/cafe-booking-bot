[booking]
# Дата визита: "auto" — новая дата сегодняшнего открытия по Москве.
# Можно задать "YYYY-MM-DD" явно. Если поле отсутствует, используется "auto".
visit_date = "auto"
# Число гостей в заявке: целое от 1 до 7.
guests = 2
# Самое раннее допустимое время начала визита, включительно (HH:MM).
time_from = "17:00"
# Самое позднее допустимое время начала визита, включительно (HH:MM).
time_to = "22:00"
# Желаемое время внутри окна: бот сначала выбирает ближайший к нему слот.
preferred_time = "20:00"
# Разрешённые залы. При одинаковой близости ко времени побеждает первый в списке.
allowed_rooms = ["Основной зал", "Открытая кухня"]
# Разрешить посадку за общий стол с другими гостями.
allow_common_table = true
# Разрешить распознаваемые виджетом места за стойкой шефа для двух гостей.
allow_chefs_counter = true
# Максимальная общая предоплата по заявке в рублях на всех гостей.
# При превышении лимита бот останавливается. Оплату пользователь делает сам.
max_deposit_rub = 20000

[release]
# Часовой пояс открытия записи; для Birch поддерживается только Europe/Moscow.
timezone = "Europe/Moscow"
# Время начала поиска по Москве (HH:MM:SS), не раньше 14:00:00.
opens_at = "14:00:00"
# За сколько секунд до opens_at начать проверку виджета: от 10 до 600.
prepare_seconds = 120
# Минимальный интервал между началами запросов слотов, в мс: от 50 до 10000.
# Запросы последовательные; длительность ответа входит в этот интервал.
poll_interval_ms = 50
# Продолжительность поиска от opens_at, в секундах: от 1 до 600.
# После дедлайна заявки не отправляются; поздний запуск получает статус EXPIRED.
max_poll_seconds = 60

[consents]
# Подтверждение ознакомления с политикой конфиденциальности Birch.
# Обязательно true для --live; установите после ознакомления с политикой.
privacy = true
# Подтверждение ознакомления с действующими правилами ресторана.
# Обязательно true для --live; установите после ознакомления с правилами.
restaurant_rules = true
